# Reverse proxy for CloudPulse. Adjust server_name and certificate paths.
server {
    listen 443 ssl;
    http2 on;
    server_name cloudpulse.example.com;

    ssl_certificate     /etc/nginx/certs/cloudpulse.crt;
    ssl_certificate_key /etc/nginx/certs/cloudpulse.key;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8694;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The assistant streams its answers
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name cloudpulse.example.com;
    return 301 https://$host$request_uri;
}
